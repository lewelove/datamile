[package]
name = "datamile"
version = "0.1.0"
edition = "2024"
description = "Datamile: Data-driven Album Library Engine."
license = "AGPL-3.0-only"
repository = "https://github.com/lewelove/datamile"
readme = "../../README.md"
keywords = ["mpd", "music", "metadata", "audio", "server"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[[bin]]
name = "datamile"
path = "src/main.rs"

[dependencies]
datamile-album-legacy = { workspace = true }
datamile-fs = { workspace = true }
datamile-lua-domain = { workspace = true }
datamile-server = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
simple_logger = { workspace = true }
tokio = { workspace = true }
