[package]
name = "libdatamile"
version = "0.1.0"
edition = "2024"
description = "Headless core library for Datamile, housing models, config, and pure domain logic."
repository = "https://github.com/lewelove/datamile"
license = "AGPL-3.0-only"

[lints]
workspace = true

[dependencies]
datamile-cache = { workspace = true }
datamile-fs = { workspace = true }
datamile-lua = { workspace = true }
datamile-lua-domain = { workspace = true }

anyhow = { workspace = true }
log = { workspace = true }
mlua = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
