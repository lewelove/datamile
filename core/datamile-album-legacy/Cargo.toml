[package]
name = "datamile-album-legacy"
version = "0.1.0"
edition = "2024"
description = "Album domain backend for Datamile, quarantined from the media-agnostic core."
license = "AGPL-3.0-only"
repository = "https://github.com/lewelove/datamile"

[lints]
workspace = true

[dependencies]
datamile-audio = { workspace = true }
datamile-cache = { workspace = true }
datamile-fs = { workspace = true }
datamile-images = { workspace = true }
datamile-logic = { workspace = true }
datamile-lua = { workspace = true }
datamile-lua-domain = { workspace = true }
datamile-server = { workspace = true }

anyhow = { workspace = true }
log = { workspace = true }
mlua = { workspace = true }
mpd_client = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true, features = ["query"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
