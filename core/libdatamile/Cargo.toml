[package]
name = "libdatamile"
version = "0.1.0"
edition = "2024"
description = "Headless core library for Datamile, housing models, config, and pure domain logic."
repository = "https://github.com/lewelove/datamile"
license = "AGPL-3.0-only"

[lints]
workspace = true

[dependencies]
datamile-cache = { workspace = true }
datamile-fs = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
dotenv-ng-core = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
mlua = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
